<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة المشتريات — روائع الماضي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main>
    <section class="section-sm" style="padding-bottom:24px">
      <div class="container">
        <span class="eyebrow">خطوة قبل الكنز</span>
        <h1 style="font-size:clamp(2rem,4vw,3rem)">سلة المشتريات</h1>
      </div>
    </section>

    <section class="container section-sm" style="padding-top:20px;padding-bottom:90px">
      <div class="cart-layout">
        <div class="cart-list" id="cart-list"></div>
        <aside class="summary-card" id="cart-summary"></aside>
      </div>

      <div id="checkout-area" hidden style="margin-top:40px;max-width:700px;margin-inline:auto">
        <div class="contact-form-card">
          <h3 style="margin-bottom:8px">إتمام الطلب</h3>
          <p style="color:var(--muted);font-size:.9rem;margin-bottom:22px">أدخل بياناتك وسنتواصل معك لتأكيد التفاصيل ومواعيد الشحن.</p>
          <form id="checkout-form">
            <div class="form-row">
              <div class="form-group"><label for="co-name">الاسم الكامل *</label><input class="form-control" id="co-name" name="name" required placeholder="اسم المستلم"></div>
              <div class="form-group"><label for="co-phone">رقم الجوال *</label><input class="form-control" id="co-phone" name="phone" type="tel" required placeholder="05xxxxxxxx"></div>
            </div>
            <div class="form-group"><label for="co-email">البريد الإلكتروني *</label><input class="form-control" id="co-email" name="email" type="email" required placeholder="name@example.com"></div>
            <div class="form-group"><label for="co-address">العنوان *</label><input class="form-control" id="co-address" name="address" required placeholder="المدينة، الحي، رقم المبنى"></div>
            <div class="form-group"><label for="co-notes">ملاحظات (اختياري)</label><textarea class="form-control" id="co-notes" name="notes" style="min-height:90px" placeholder="أي تفاصيل تريد إضافتها..."></textarea></div>
            <button class="btn btn-primary btn-block" type="submit">تأكيد الطلب</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
